# CI/CD for Happy Headlines: builds every service on each change, and delivers versioned Docker images
# to the GitHub Container Registry (ghcr.io) when something new arrives on main.
#   push to main   -> compile, then build AND push the 7 images
#   pull request   -> compile and build the images, but push nothing
name: Build and deliver

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  WEEK: week-44                                                  # the week folder the pipeline builds
  IMAGE_PREFIX: ghcr.io/christianvistilyth/happy-headlines        # images: <prefix>/<service>:<tag>

jobs:
  # Continuous integration: a commit that doesn't compile never becomes an image
  build:
    name: Compile the solution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build ${{ env.WEEK }}/HappyHeadlines.slnx --configuration Release

  # Continuous delivery: one parallel job per service, so you can see exactly which one fails
  images:
    name: Image ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                                            # allows pushing to ghcr.io with GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: ArticleService,     image: article-service }
          - { service: ArticleCacheFiller, image: article-cache-filler }
          - { service: CommentService,     image: comment-service }
          - { service: ProfanityService,   image: profanity-service }
          - { service: DraftService,       image: draft-service }
          - { service: PublisherService,   image: publisher-service }
          - { service: NewsletterService,  image: newsletter-service }
          - { service: SubscriberService,  image: subscriber-service }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}                  # built in: no secret to set up

      # Three tags per image: a version number, the commit it was built from, and latest
      - name: Version tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}
          tags: |
            type=raw,value=1.0.${{ github.run_number }}
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.WEEK }}/src                           # the src folder, so the shared libraries are included
          file: ${{ env.WEEK }}/src/${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
