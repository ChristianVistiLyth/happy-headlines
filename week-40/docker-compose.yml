# Week 40: caches in front of the far-away databases, and a dashboard with their hit ratio.
# ArticleCache (Redis) sits between ArticleService and the Global article database, filled by an offline process;
# CommentCache (Redis) sits between CommentService and the comment database, filled on a cache miss.
# Swimlanes: Article, Comment, Profanity and Draft each have their own service(s), database(s) and cache.
# Every service sends its logs and traces to the central monitoring stack (OpenTelemetry → Loki/Tempo → Grafana).
#
#   http://localhost:3000          Grafana (logs and traces)
#   http://localhost:8080          Structurizr (C4 diagrams)
#   http://localhost:8081/swagger  ArticleService (through the load balancer)
#   http://localhost:8082/swagger  CommentService
#   http://localhost:8083/swagger  ProfanityService
#   http://localhost:8084/swagger  DraftService
#   http://localhost:8085/swagger  PublisherService
#   http://localhost:8086/swagger  NewsletterService
#   http://localhost:15672         RabbitMQ (ArticleQueue) - login guest / guest

# Shared settings for the eight region databases
x-article-database: &article-database
  image: postgres:17-alpine
  environment:
    POSTGRES_DB: articles
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d articles"]
    interval: 5s
    timeout: 3s
    retries: 10

# Shared settings for the three ArticleService instances
x-article-service: &article-service
  build:
    context: ./src
    dockerfile: ArticleService/Dockerfile
  image: happy-headlines/article-service:week-40
  environment: &article-service-environment
    ASPNETCORE_ENVIRONMENT: Development
    OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
    OTEL_METRIC_EXPORT_INTERVAL: 5000   # send the cache metrics every 5 s (default 60 s), so the dashboard is live
    ArticleDatabases__Africa: Host=article-db-africa;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__Antarctica: Host=article-db-antarctica;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__Asia: Host=article-db-asia;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__Europe: Host=article-db-europe;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__NorthAmerica: Host=article-db-north-america;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__Oceania: Host=article-db-oceania;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__SouthAmerica: Host=article-db-south-america;Database=articles;Username=postgres;Password=postgres
    ArticleDatabases__Global: Host=article-db-global;Database=articles;Username=postgres;Password=postgres
    RabbitMQ__ConnectionString: host=rabbitmq
    ConnectionStrings__ArticleCache: article-cache:6379
  # No depends_on rabbitmq or article-cache: ArticleService serves HTTP without them
  depends_on:
    article-db-africa: { condition: service_healthy }
    article-db-antarctica: { condition: service_healthy }
    article-db-asia: { condition: service_healthy }
    article-db-europe: { condition: service_healthy }
    article-db-north-america: { condition: service_healthy }
    article-db-oceania: { condition: service_healthy }
    article-db-south-america: { condition: service_healthy }
    article-db-global: { condition: service_healthy }

services:
  structurizr:
    image: structurizr/structurizr
    command: local
    ports:
      - "8080:8080"
    volumes:
      - ./docs:/usr/local/structurizr

  # Central monitoring in one container: OpenTelemetry Collector (receives logs and traces),
  # Loki (stores logs), Tempo (stores traces), Prometheus (stores metrics) and Grafana (shows it all).
  # No service depends on it: if monitoring is down, the system keeps working.
  monitoring:
    image: grafana/otel-lgtm
    ports:
      - "3000:3000"
    volumes:
      - monitoring:/data
      # The cache hit-ratio dashboard, loaded into Grafana at startup (http://localhost:3000/d/cache-hit-ratio)
      - ./monitoring/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/happy-headlines.yaml:ro
      - ./monitoring/dashboards:/otel-lgtm/happy-headlines-dashboards:ro

  # ArticleQueue: RabbitMQ message broker. The web UI shows the queues and the messages in them.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    hostname: rabbitmq   # RabbitMQ stores its data per host name, so it must stay the same between restarts
    ports:
      - "15672:15672"
    healthcheck:
      # Runs as the rabbitmq user: if the check runs before RabbitMQ has created its Erlang cookie (an internal
      # password file), the check creates it - and it must belong to RabbitMQ, or RabbitMQ can't start
      test: ["CMD", "su-exec", "rabbitmq", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [rabbitmq:/var/lib/rabbitmq]

  # Publishes articles: filters profanity, then puts the article on the ArticleQueue
  publisher-service:
    build:
      context: ./src
      dockerfile: PublisherService/Dockerfile
    image: happy-headlines/publisher-service:week-40
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      ProfanityService__BaseUrl: http://profanity-service:8080/
      # publisherConfirms: RabbitMQ confirms it has the message; timeout: give up after 5 s if it doesn't answer
      RabbitMQ__ConnectionString: host=rabbitmq;publisherConfirms=true;timeout=5
    ports:
      - "8085:8080"
    # Deliberately NOT depending on rabbitmq or profanity-service: if one is down, publishing answers 503

  # Sends newsletters: immediately for every article on the ArticleQueue, and once a day with the latest articles
  newsletter-service:
    build:
      context: ./src
      dockerfile: NewsletterService/Dockerfile
    image: happy-headlines/newsletter-service:week-40
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      RabbitMQ__ConnectionString: host=rabbitmq
      ArticleService__BaseUrl: http://article-load-balancer/
      Newsletter__DailySendTimeUtc: "06:00"
    ports:
      - "8086:8080"

  # ArticleDatabase, z-axis split: one database per continent + one for global news
  article-db-africa:
    <<: *article-database
    volumes: [article-db-africa:/var/lib/postgresql/data]
  article-db-antarctica:
    <<: *article-database
    volumes: [article-db-antarctica:/var/lib/postgresql/data]
  article-db-asia:
    <<: *article-database
    volumes: [article-db-asia:/var/lib/postgresql/data]
  article-db-europe:
    <<: *article-database
    volumes: [article-db-europe:/var/lib/postgresql/data]
  article-db-north-america:
    <<: *article-database
    volumes: [article-db-north-america:/var/lib/postgresql/data]
  article-db-oceania:
    <<: *article-database
    volumes: [article-db-oceania:/var/lib/postgresql/data]
  article-db-south-america:
    <<: *article-database
    volumes: [article-db-south-america:/var/lib/postgresql/data]
  article-db-global:
    <<: *article-database
    volumes: [article-db-global:/var/lib/postgresql/data]

  # ArticleCache: Redis in front of the Global database (Article swimlane). Only memory, nothing saved to disk:
  # it is a cache, so after a restart the ArticleCacheFiller fills it again.
  article-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The offline process that fills the ArticleCache with the Global articles of the last 14 days.
  # It fills once at startup and then every interval, so "docker compose restart article-cache-filler" fills now.
  article-cache-filler:
    build:
      context: ./src
      dockerfile: ArticleCacheFiller/Dockerfile
    image: happy-headlines/article-cache-filler:week-40
    environment:
      DOTNET_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      ConnectionStrings__GlobalArticleDatabase: Host=article-db-global;Database=articles;Username=postgres;Password=postgres
      ConnectionStrings__ArticleCache: article-cache:6379
      ArticleCacheFiller__Interval: "00:05:00"
    depends_on:
      article-db-global: { condition: service_healthy }

  # ArticleService, x-axis split: three identical instances
  article-service-1:
    <<: *article-service
    environment:
      <<: *article-service-environment
      InstanceName: article-service-1
  article-service-2:
    <<: *article-service
    environment:
      <<: *article-service-environment
      InstanceName: article-service-2
  article-service-3:
    <<: *article-service
    environment:
      <<: *article-service-environment
      InstanceName: article-service-3

  # Load balancer in front of the three instances
  article-load-balancer:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - article-service-1
      - article-service-2
      - article-service-3

  # Comment swimlane: its own service and its own database
  comment-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comments
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d comments"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [comment-db:/var/lib/postgresql/data]

  # CommentCache: Redis in front of the comment database (Comment swimlane), filled on a cache miss.
  # Only memory, nothing saved to disk: it is a cache, so after a restart it fills up again by itself.
  comment-cache:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  comment-service:
    build:
      context: ./src
      dockerfile: CommentService/Dockerfile
    image: happy-headlines/comment-service:week-40
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      OTEL_METRIC_EXPORT_INTERVAL: 5000   # send the cache metrics every 5 s (default 60 s), so the dashboard is live
      ConnectionStrings__CommentDatabase: Host=comment-db;Database=comments;Username=postgres;Password=postgres
      ConnectionStrings__CommentCache: comment-cache:6379
      CommentCache__MaxArticles: 30   # the comments of the 30 most recently read articles; then LRU cleans up
      ProfanityService__BaseUrl: http://profanity-service:8080/
    ports:
      - "8082:8080"
    # Deliberately NOT depending on profanity-service: CommentService must start, and serve comments, without it
    depends_on:
      comment-db: { condition: service_healthy }

  # Profanity swimlane: its own service and its own database
  profanity-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: profanity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d profanity"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [profanity-db:/var/lib/postgresql/data]
  profanity-service:
    build:
      context: ./src
      dockerfile: ProfanityService/Dockerfile
    image: happy-headlines/profanity-service:week-40
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      ConnectionStrings__ProfanityDatabase: Host=profanity-db;Database=profanity;Username=postgres;Password=postgres
    ports:
      - "8083:8080"
    depends_on:
      profanity-db: { condition: service_healthy }

  # Draft swimlane: its own service and its own database
  draft-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drafts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d drafts"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [draft-db:/var/lib/postgresql/data]
  draft-service:
    build:
      context: ./src
      dockerfile: DraftService/Dockerfile
    image: happy-headlines/draft-service:week-40
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_EXPORTER_OTLP_ENDPOINT: http://monitoring:4317
      ConnectionStrings__DraftDatabase: Host=draft-db;Database=drafts;Username=postgres;Password=postgres
    ports:
      - "8084:8080"
    depends_on:
      draft-db: { condition: service_healthy }

  # Demo traffic for the cache dashboard - only started on request:
  #   docker compose --profile demo up -d traffic      (stop: docker compose stop traffic)
  traffic:
    image: curlimages/curl
    profiles: [demo]
    entrypoint: ["sh", "/traffic.sh"]
    volumes:
      - ./tools/traffic.sh:/traffic.sh:ro

volumes:
  monitoring:
  rabbitmq:
  article-db-africa:
  article-db-antarctica:
  article-db-asia:
  article-db-europe:
  article-db-north-america:
  article-db-oceania:
  article-db-south-america:
  article-db-global:
  comment-db:
  profanity-db:
  draft-db:
