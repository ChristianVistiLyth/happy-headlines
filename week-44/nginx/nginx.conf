events {}

http {
    # x-axis split: three identical ArticleService instances. nginx sends requests to them in turn (round-robin).
    upstream article_service {
        server article-service-1:8080;
        server article-service-2:8080;
        server article-service-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://article_service;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # If an instance is down, give up on it quickly and try the next one
            proxy_connect_timeout 2s;
        }
    }
}
